<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Mahjong</title>
<meta name="description" content="A calm, offline game of mahjong solitaire.">
<meta name="theme-color" content="#10362a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="stat"><b id="stat-layout">Turtle</b><span>Board</span></div>
    <div class="spacer"></div>
    <div class="stat"><b id="stat-left">144</b><span>Tiles left</span></div>
    <div class="stat"><b id="stat-time">0:00</b><span>Time</span></div>
  </div>

  <div id="stage">
    <div id="board"></div>
    <div id="rotate-hint" hidden><span class="glyph">&#8635;</span> Turn sideways for bigger tiles</div>
    <div id="toast"></div>
  </div>

  <div id="controls">
    <button id="btn-undo"><span class="glyph">&#8630;</span>Undo</button>
    <button id="btn-hint"><span class="glyph">&#128161;</span>Hint</button>
    <button id="btn-shuffle"><span class="glyph">&#9862;</span>Shuffle<span class="count" id="shuffle-count"></span></button>
    <button id="btn-menu"><span class="glyph">&#9776;</span>Menu</button>
  </div>

  <!-- Menu ------------------------------------------------------------- -->
  <div class="overlay" id="menu" hidden>
    <div class="sheet">
      <h1>Mahjong</h1>
      <p class="lede">Match two identical tiles that are free to lift. A tile is free when nothing sits on top of it and one long side is clear.</p>
      <h2>Choose a board</h2>
      <div id="layout-list"></div>
      <h2>This game</h2>
      <button class="wide-btn primary" id="btn-resume">Keep playing</button>
      <button class="wide-btn" id="btn-restart">Start this board again</button>
      <h2>Settings</h2>
      <button class="toggle" id="btn-sound">Sound<span class="state" id="sound-state">On</span></button>
      <button class="toggle" id="btn-showfree">Dim the tiles you can&rsquo;t lift<span class="state" id="showfree-state">On</span></button>
    </div>
  </div>

  <!-- Win -------------------------------------------------------------- -->
  <div class="overlay" id="win" hidden>
    <div class="sheet">
      <h1>Board cleared</h1>
      <p class="lede" id="win-detail"></p>
      <button class="wide-btn primary" id="btn-again">New game</button>
      <button class="wide-btn" id="btn-win-menu">Choose another board</button>
    </div>
  </div>

  <!-- Stuck ------------------------------------------------------------ -->
  <div class="overlay" id="stuck" hidden>
    <div class="sheet">
      <h1 id="stuck-title">No moves left</h1>
      <p class="lede" id="stuck-detail"></p>
      <button class="wide-btn primary" id="btn-stuck-shuffle">Shuffle the tiles</button>
      <button class="wide-btn" id="btn-stuck-undo">Take back my last move</button>
      <button class="wide-btn" id="btn-stuck-new">Start a new game</button>
    </div>
  </div>
</div>

<script src="js/layouts.js"></script>
<script src="js/tiles.js"></script>
<script src="js/engine.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
